
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="description" content="AgriFlow is a professional agricultural management platform empowering farmers with AI-driven insights, crop health monitoring, and real-time market analytics." />
    <meta name="theme-color" content="#057855" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>AgriFlow - Smart Farming</title>
    
    <link rel="icon" href="/logo-AgriFlow.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                950: '#020617',
              },
              terra: {
                50: '#F4F9F6',
                100: '#E4F0EA',
                200: '#C8DFD3',
                300: '#A0C4B2',
                400: '#74A78E',
                500: '#548D73',
                600: '#3E735D',
                700: '#305A49',
                800: '#264839',
                900: '#1A3428',
              },
              sunburst: {
                50: '#FFFCEB',
                100: '#FFF7C2',
                200: '#FFEE85',
                300: '#FFE048',
                400: '#FFCC11',
                500: '#F5B800',
                600: '#CC9A00',
                700: '#997300',
                800: '#7A5C00',
                900: '#5C4500',
              },
              jade: {
                50: '#EFFCF6',
                100: '#D1F9E8',
                200: '#A6F0D4',
                300: '#6CE4BA',
                400: '#38D19E',
                500: '#14B882',
                600: '#069669',
                700: '#057855',
                800: '#075E45',
                900: '#084D3A',
                950: '#032B21',
              }
            },
            animation: {
              'slow-pan': 'pan 60s linear infinite alternate',
              'slow-zoom': 'zoom 20s ease-in-out infinite alternate',
              'stagger-1': 'fade-in-up 0.5s ease-out 0.05s forwards',
              'stagger-2': 'fade-in-up 0.5s ease-out 0.1s forwards',
              'stagger-3': 'fade-in-up 0.5s ease-out 0.15s forwards',
              'stagger-4': 'fade-in-up 0.5s ease-out 0.2s forwards',
              'stagger-5': 'fade-in-up 0.5s ease-out 0.25s forwards',
              'stagger-6': 'fade-in-up 0.5s ease-out 0.3s forwards',
              'float': 'float 6s ease-in-out infinite',
              'glow-pulse': 'glow-pulse 3s ease-in-out infinite',
            },
            keyframes: {
              pan: {
                '0%': { transform: 'scale(1.1) translate(0%, 0%)' },
                '100%': { transform: 'scale(1.2) translate(-3%, -3%)' },
              },
              zoom: {
                '0%': { transform: 'scale(1.0)' },
                '100%': { transform: 'scale(1.1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-6px)' },
              },
              'glow-pulse': {
                '0%, 100%': { opacity: '0.4' },
                '50%': { opacity: '0.8' },
              }
            },
            borderRadius: {
              '2xl': '1rem',
              '3xl': '1.25rem',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-app: #EFFCF6;
        --bg-content: #D1F9E8;
        --bg-card: #FFFFFF;
        --bg-card-inner: #F0FDF8;
        --bg-sidebar: #F7FDFB;
        --bg-jade-50: #EFFCF6;
        --accent-green: #057855;
        --accent-gold: #F5B800;
        --text-primary: #0A2E23;
        --text-secondary: #3D6B5A;
        --text-tertiary: #74A78E;
        --border-primary: #A6F0D4;
        --border-card: #C8F4E0;
        --shadow-card: 0 1px 3px rgba(8,77,58,0.06), 0 1px 2px rgba(8,77,58,0.04);
        --shadow-card-hover: 0 4px 12px rgba(8,77,58,0.1), 0 2px 4px rgba(8,77,58,0.06);
        --radius-card: 16px;
        --radius-inner: 12px;
        --ring-color: #057855;
      }

      .dark {
        --bg-app: #041A14;
        --bg-content: #072118;
        --bg-card: #0C2E23;
        --bg-card-inner: #103B2D;
        --bg-sidebar: #061912;
        --accent-green: #38D19E;
        --accent-gold: #FFCC11;
        --text-primary: #E8F5EE;
        --text-secondary: #7BA896;
        --text-tertiary: #4A7A66;
        --border-primary: #1A4D3C;
        --border-card: #1E5A47;
        --shadow-card: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
        --shadow-card-hover: 0 4px 12px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);
        --ring-color: #38D19E;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-app);
        color: var(--text-primary);
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      
      .dark body {
        background-color: var(--bg-app);
        color: var(--text-primary);
      }

      .font-heading {
        font-family: 'IBM Plex Sans', sans-serif;
      }

      .font-display {
        font-family: 'DM Serif Display', serif;
      }
      
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #A0C4B2;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #74A78E;
      }
      
      .dark ::-webkit-scrollbar-thumb {
        background: #1E5A47;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #2A7A62;
      }
      .high-contrast ::-webkit-scrollbar-thumb {
        background: #14FF82;
      }
      .high-contrast ::-webkit-scrollbar-thumb:hover {
        background: #FFFFFF;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }

  .safe-area-bottom {
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
      
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
      
  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in-up {
    animation: fade-in-up 0.4s ease-out forwards;
  }

    @keyframes page-enter {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-page-enter {
      animation: page-enter 0.3s ease-out forwards;
    }

    @keyframes zoom {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
    .animate-slow-zoom {
      animation: zoom 20s ease-in-out infinite alternate;
    }
    
    /* Interactive enhancements */
   button:focus-visible,
   [role="button"]:focus-visible,
   [role="checkbox"]:focus-visible,
   input:focus-visible,
   select:focus-visible,
   textarea:focus-visible {
     outline: 2px solid var(--ring-color, var(--accent-green));
     outline-offset: 2px;
   }
   
   button:active,
   [role="button"]:active {
     transform: scale(0.97);
   }
   
   /* Ensure minimum touch target */
   button,
   [role="button"],
   input,
   select,
   textarea,
   .label-clickable {
     min-height: 44px;
     min-width: 44px;
   }
   
   /* High contrast mode support */
    .high-contrast {
      --bg-app: #000000;
      --bg-content: #000000;
      --bg-card: #111111;
      --bg-card-inner: #0A0A0A;
      --bg-sidebar: #000000;
      --text-primary: #FFFFFF;
      --text-secondary: #E0E0E0;
      --border-primary: #FFFFFF;
      --border-card: #CCCCCC;
      --accent-green: #14FF82;
      --accent-gold: #FFD700;
      --shadow-card: 0 1px 3px rgba(255,255,255,0.1), 0 1px 2px rgba(255,255,255,0.06);
      --shadow-card-hover: 0 4px 12px rgba(255,255,255,0.15), 0 2px 4px rgba(255,255,255,0.1);
      --ring-color: #14FF82;
    }
   
   /* Reduced motion */
   @media (prefers-reduced-motion: reduce) {
     * {
       animation-duration: 0.01ms !important;
       animation-iteration-count: 1 !important;
       transition-duration: 0.01ms !important;
     }
   }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .animate-shimmer {
    background: linear-gradient(90deg, transparent 25%, rgba(160,196,178,0.08) 50%, transparent 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
  }
  .dark .animate-shimmer {
    background: linear-gradient(90deg, transparent 25%, rgba(56,209,158,0.04) 50%, transparent 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
  }

  .card-surface {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .card-surface:hover {
    box-shadow: var(--shadow-card-hover);
  }

  .card-inner {
    background: var(--bg-card-inner);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-inner);
  }

  .border-theme {
    border-color: var(--border-primary);
  }

  .bg-app { background-color: var(--bg-app); }
  .bg-content { background-color: var(--bg-content); }
  .bg-card-dynamic { background-color: var(--bg-card); }
  .bg-card-inner-dynamic { background-color: var(--bg-card-inner); }
  .bg-sidebar-dynamic { background-color: var(--bg-sidebar); }
  .text-primary-dynamic { color: var(--text-primary); }
  .text-secondary-dynamic { color: var(--text-secondary); }
  .border-primary-dynamic { border-color: var(--border-primary); }
  .border-card-dynamic { border-color: var(--border-card); }

  .subtle-grain {
    position: relative;
  }
  .subtle-grain::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.06;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    border-radius: inherit;
    z-index: 1;
  }
  .dark .subtle-grain::before {
    opacity: 0.09;
  }

  .leaf-glow {
    position: relative;
    overflow: hidden;
  }
  .leaf-glow::after {
    content: '';
    position: absolute;
    top: -40%;
    right: -30%;
    width: 60%;
    height: 80%;
    background: radial-gradient(circle, rgba(5,120,85,0.12) 0%, transparent 70%);
    pointer-events: none;
    border-radius: 50%;
  }
  .dark .leaf-glow::after {
    background: radial-gradient(circle, rgba(56,209,158,0.08) 0%, transparent 70%);
  }

  .sun-glow {
    position: relative;
    overflow: hidden;
  }
  .sun-glow::before {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -20%;
    width: 50%;
    height: 60%;
    background: radial-gradient(circle, rgba(245,184,0,0.12) 0%, transparent 70%);
    pointer-events: none;
    border-radius: 50%;
  }

  .organic-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--border-primary) 20%, var(--border-primary) 80%, transparent 100%);
  }
    </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
